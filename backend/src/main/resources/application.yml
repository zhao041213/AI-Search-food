server:
  port: 7068

spring:
  application:
    name: ai-smart-recipe-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${H2_URL:jdbc:h2:mem:ai_smart_recipe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  ingredient-images:
    enabled: ${INGREDIENT_IMAGES_ENABLED:true}
  finished-dish-reviews:
    storage-dir: ${FINISHED_DISH_REVIEW_STORAGE_DIR:./data/finished-dish-reviews}
  user-avatars:
    storage-dir: ${USER_AVATAR_STORAGE_DIR:./data/user-avatars}
  notifications:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
      fixed-delay: ${NOTIFICATION_SCHEDULER_FIXED_DELAY:PT1H}
      initial-delay: ${NOTIFICATION_SCHEDULER_INITIAL_DELAY:PT30S}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  sms:
    provider: ${SMS_PROVIDER:mock}
    code-expiry: ${SMS_CODE_EXPIRY:5m}
    resend-interval: ${SMS_RESEND_INTERVAL:60s}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    pnvs:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME:}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      connect-timeout: ${PNVS_CONNECT_TIMEOUT:5s}
      read-timeout: ${PNVS_READ_TIMEOUT:10s}
  ai:
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      endpoint: ${DASHSCOPE_BASE_URL:${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}}
