server:
  port: 7068

spring:
  application:
    name: ai-smart-recipe-backend
  datasource:
    url: ${H2_URL:jdbc:h2:mem:ai_smart_recipe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  auth:
    mock-code: ${MOCK_LOGIN_CODE:123456}
  ai:
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      endpoint: ${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
